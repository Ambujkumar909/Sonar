# Sonar — nginx_proxy vhost (honocode server)
# Place at: /data/nginx-proxy/conf.d/sonar.conf  then reload nginx_proxy.
# Single upstream (container "sonar" on shared_proxy, port 4545).

server {
    listen 80;
    server_name sonar.ddecor.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sonar.ddecor.com;

    ssl_certificate     /etc/nginx/certs/sonar.ddecor.com.crt;
    ssl_certificate_key /etc/nginx/certs/sonar.ddecor.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 2m;   # app JSON limit is 1mb; headroom for QR/login posts

    # Live feed uses Socket.IO (WebSocket). Keep this block BEFORE "location /".
    location /socket.io/ {
        proxy_pass         http://sonar:4545;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # long-lived socket
    }

    location / {
        proxy_pass         http://sonar:4545;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;   # makes Sonar set Secure cookie
        proxy_read_timeout 65s;
        proxy_connect_timeout 10s;
    }

    access_log /var/log/nginx/sonar_access.log;
    error_log  /var/log/nginx/sonar_error.log;
}
