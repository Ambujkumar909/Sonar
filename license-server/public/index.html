<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sonar License Server — Admin</title>
<style>
  :root{
    --bg-solid:#F1E2C2; --ink:#2A2018; --soft:#6A5B47; --faint:#9C8B73;
    --surface:rgba(255,253,247,.78); --surface2:rgba(255,252,244,.95);
    --border:rgba(120,90,50,.18); --border2:rgba(120,90,50,.3);
    --accent:#1C8F52; --gold:#BE8429; --danger:#C0492F; --warn:#C07A1E;
    --font:'Plus Jakarta Sans',system-ui,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);color:var(--ink);font-size:16px;min-height:100vh;
    background:radial-gradient(900px 700px at 6% 4%,#FFFEFA,transparent 46%),
      radial-gradient(1000px 900px at 96% 96%,rgba(206,162,92,.28),transparent 52%),
      linear-gradient(135deg,#FFFCF4,#F3E2C2 55%,#E4CB9E);background-attachment:fixed}
  .wrap{max-width:1150px;margin:0 auto;padding:34px 26px 80px}
  h1{font-size:30px;font-weight:800;letter-spacing:-.5px}
  .sub{color:var(--faint);margin-bottom:24px;font-size:14px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;
    box-shadow:0 18px 50px -22px rgba(60,40,15,.4);backdrop-filter:blur(10px);margin-bottom:20px}
  h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--soft);margin-bottom:14px;font-weight:800}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
  .field{display:flex;flex-direction:column;gap:6px}
  label{font-size:12.5px;font-weight:700;color:var(--soft)}
  input,select{padding:11px 14px;border-radius:10px;border:1px solid var(--border2);
    background:var(--surface2);color:var(--ink);font-size:15px;font-family:inherit;outline:none}
  .btn{cursor:pointer;padding:11px 16px;border-radius:10px;font-weight:700;font-size:14px;
    border:1px solid var(--border2);background:var(--surface2);color:var(--ink);transition:.2s}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff;border-color:transparent}
  .btn.gold{background:var(--gold);color:#1a1206;border-color:transparent}
  .btn.danger{color:var(--danger);border-color:rgba(192,73,47,.4)}
  .btn.sm{padding:6px 11px;font-size:12.5px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--border)}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);font-weight:800}
  .key{font-family:ui-monospace,monospace;font-weight:700}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:800;text-transform:uppercase}
  .s-active{background:rgba(28,143,82,.16);color:var(--accent)}
  .s-expired{background:rgba(192,122,30,.16);color:var(--warn)}
  .s-revoked{background:rgba(192,73,47,.16);color:var(--danger)}
  .s-inactive{background:rgba(120,90,50,.12);color:var(--soft)}
  .gate{max-width:420px;margin:14vh auto 0}
  .actions{display:flex;gap:6px;flex-wrap:wrap}
  .toast{position:fixed;right:20px;bottom:20px;background:var(--surface2);border:1px solid var(--border2);
    padding:13px 17px;border-radius:12px;font-weight:700;box-shadow:0 18px 50px -22px rgba(60,40,15,.5)}
  .hide{display:none}
  .keybox{background:var(--surface2);border:1px dashed var(--gold);border-radius:10px;padding:14px;margin-top:12px;
    font-family:ui-monospace,monospace;font-size:17px;font-weight:800;text-align:center;letter-spacing:1px}
</style>

<div class="wrap">
  <!-- admin gate -->
  <div id="gate" class="card gate">
    <h1>🔑 Sonar Licenses</h1>
    <div class="sub">Enter the admin key to manage licenses.</div>
    <div class="field"><label>Admin key</label><input id="adminKey" type="password" placeholder="LICENSE_ADMIN_KEY" /></div>
    <button class="btn primary" id="enter" style="margin-top:12px;width:100%">Enter</button>
    <div id="gateErr" style="color:var(--danger);font-weight:700;margin-top:10px;font-size:13px"></div>
  </div>

  <!-- console -->
  <div id="console" class="hide">
    <h1>🔑 Sonar License Server</h1>
    <div class="sub">Issue, extend, revoke, and migrate machine-bound licenses.</div>

    <div class="card">
      <h3>Create a license</h3>
      <div class="row">
        <div class="field"><label>Customer</label><input id="cCustomer" placeholder="Acme Pvt Ltd" /></div>
        <div class="field"><label>Plan length (days)</label><input id="cDays" type="number" value="30" style="width:140px" /></div>
        <div class="field" style="flex:1;min-width:160px"><label>Note</label><input id="cNote" placeholder="optional" /></div>
        <button class="btn primary" id="create">＋ Generate key</button>
      </div>
      <div id="newKey" class="keybox hide"></div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <h3 style="margin:0">Licenses</h3>
        <button class="btn sm" id="refresh">↻ Refresh</button>
      </div>
      <div style="overflow-x:auto"><table id="tbl"></table></div>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s)
let KEY=sessionStorage.getItem('sonar-admin-key')||''
const api=async(path,opts={})=>{
  opts.headers={...(opts.headers||{}),'x-admin-key':KEY,'Content-Type':'application/json'}
  return (await fetch('/api'+path,opts)).json()
}
const toast=m=>{const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}
const fmt=t=>t?new Date(t).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}):'—'
const daysLeft=t=>{if(!t)return '';const d=Math.ceil((t-Date.now())/86400000);return d>0?d+'d left':Math.abs(d)+'d ago'}

async function load(){
  const r=await api('/admin/licenses')
  if(!r.ok){gate(r.error);return}
  $('#gate').classList.add('hide');$('#console').classList.remove('hide')
  const rows=r.licenses.map(l=>`<tr>
    <td><span class="key">${l.key}</span></td>
    <td>${esc(l.customer||'—')}<div style="color:var(--faint);font-size:12px">${esc(l.plan||'')}</div></td>
    <td><span class="pill s-${l.status}">${l.status}</span></td>
    <td>${fmt(l.expires_at)}<div style="color:var(--faint);font-size:12px">${daysLeft(l.expires_at)}</div></td>
    <td style="font-size:12px;color:var(--soft)">${l.fingerprint?('🔒 '+(l.fp_info&&l.fp_info.host?esc(l.fp_info.host):l.fingerprint.slice(0,10)+'…')):'—'}<div style="color:var(--faint)">${l.last_seen?'seen '+fmt(l.last_seen):''}</div></td>
    <td><div class="actions">
      <button class="btn sm" data-act="extend" data-id="${l.id}">+30d</button>
      <button class="btn sm ${l.revoked?'gold':'danger'}" data-act="revoke" data-id="${l.id}" data-rev="${l.revoked?0:1}">${l.revoked?'Unrevoke':'Revoke'}</button>
      <button class="btn sm" data-act="migrate" data-id="${l.id}">Migrate</button>
      <button class="btn sm danger" data-act="del" data-id="${l.id}">✕</button>
    </div></td></tr>`).join('')
  $('#tbl').innerHTML=`<thead><tr><th>Key</th><th>Customer</th><th>Status</th><th>Expires</th><th>Machine</th><th>Actions</th></tr></thead><tbody>${rows||'<tr><td colspan=6 style="text-align:center;color:var(--faint);padding:30px">No licenses yet.</td></tr>'}</tbody>`
}
function esc(s){return (s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function gate(err){$('#console').classList.add('hide');$('#gate').classList.remove('hide');if(err)$('#gateErr').textContent=err}

$('#enter').onclick=()=>{KEY=$('#adminKey').value.trim();sessionStorage.setItem('sonar-admin-key',KEY);load()}
$('#refresh').onclick=load
$('#create').onclick=async()=>{
  const r=await api('/admin/licenses',{method:'POST',body:JSON.stringify({customer:$('#cCustomer').value,days:Number($('#cDays').value)||30,note:$('#cNote').value})})
  if(!r.ok)return toast(r.error)
  const box=$('#newKey');box.textContent=r.key;box.classList.remove('hide');navigator.clipboard?.writeText(r.key);toast('Key created & copied');load()
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return
  const id=b.dataset.id
  if(b.dataset.act==='extend'){await api('/admin/licenses/'+id+'/extend',{method:'POST',body:JSON.stringify({days:30})});toast('Extended 30 days')}
  if(b.dataset.act==='revoke'){await api('/admin/licenses/'+id+'/revoke',{method:'POST',body:JSON.stringify({revoked:b.dataset.rev==='1'})});toast('Updated')}
  if(b.dataset.act==='migrate'){if(confirm('Release the machine binding? The customer can then activate on a new server.')){await api('/admin/licenses/'+id+'/migrate',{method:'POST',body:'{}'});toast('Binding released — ready to migrate')}}
  if(b.dataset.act==='del'){if(confirm('Delete this license permanently?')){await api('/admin/licenses/'+id,{method:'DELETE'});toast('Deleted')}}
  load()
})
if(KEY)load()
</script>
